<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/>
    </marker>
  </defs>
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="130" y1="62" x2="130" y2="96"/>
    <line x1="340" y1="62" x2="340" y2="96"/>
    <line x1="278" y1="62" x2="200" y2="96"/>
    <line x1="550" y1="62" x2="550" y2="96"/>
    <line x1="470" y1="124" x2="434" y2="124"/>
    <line x1="130" y1="152" x2="130" y2="186"/>
    <line x1="340" y1="152" x2="340" y2="186"/>
    <line x1="640" y1="206" x2="434" y2="206"/>
    <polyline points="640,228 452,228 452,260 130,260 130,246"/>
    <line x1="220" y1="216" x2="246" y2="216"/>
    <line x1="340" y1="242" x2="340" y2="276"/>
    <line x1="340" y1="332" x2="340" y2="366"/>
    <line x1="730" y1="242" x2="730" y2="276"/>
    <line x1="730" y1="152" x2="730" y2="186"/>
  </g>
  <g stroke="#24292f" stroke-width="1.2">
    <rect x="40" y="10" width="180" height="52" rx="6" fill="#f6f8fa"/>
    <rect x="250" y="10" width="180" height="52" rx="6" fill="#f6f8fa"/>
    <rect x="460" y="10" width="180" height="52" rx="6" fill="#f6f8fa"/>
    <rect x="40" y="100" width="180" height="52" rx="6" fill="#d9f0ee"/>
    <rect x="250" y="100" width="180" height="52" rx="6" fill="#d9f0ee"/>
    <rect x="470" y="100" width="160" height="52" rx="6" fill="#f6f8fa"/>
    <rect x="40" y="190" width="180" height="52" rx="6" fill="#e8e4f7"/>
    <rect x="250" y="190" width="180" height="52" rx="6" fill="#e8e4f7"/>
    <rect x="640" y="100" width="180" height="52" rx="6" fill="#fff3d6"/>
    <rect x="640" y="190" width="180" height="52" rx="6" fill="#e8e4f7"/>
    <rect x="640" y="280" width="180" height="52" rx="6" fill="#e8e4f7"/>
    <rect x="250" y="280" width="180" height="52" rx="6" fill="#e8e4f7"/>
    <rect x="250" y="370" width="180" height="52" rx="6" fill="#fff3d6"/>
  </g>
  <g text-anchor="middle" fill="#24292f">
    <text x="130" y="32" font-weight="bold">Map server</text><text x="130" y="50" fill="#57606a">the stored floor plan</text>
    <text x="340" y="32" font-weight="bold">Sensors</text><text x="340" y="50" fill="#57606a">LiDAR scan, depth camera</text>
    <text x="550" y="32" font-weight="bold">Localiser</text><text x="550" y="50" fill="#57606a">AMCL or another one</text>
    <text x="130" y="122" font-weight="bold">Global costmap</text><text x="130" y="140" fill="#57606a">whole room, with margins</text>
    <text x="340" y="122" font-weight="bold">Local costmap</text><text x="340" y="140" fill="#57606a">small window, live</text>
    <text x="550" y="122" font-weight="bold">Robot position</text><text x="550" y="140" fill="#57606a">shared through TF</text>
    <text x="130" y="212" font-weight="bold">Planner server</text><text x="130" y="230" fill="#57606a">a path to the goal</text>
    <text x="340" y="212" font-weight="bold">Controller server</text><text x="340" y="230" fill="#57606a">speed, 20 times a second</text>
    <text x="730" y="122" font-weight="bold">Goal</text><text x="730" y="140" fill="#57606a">"walk to this point"</text>
    <text x="730" y="212" font-weight="bold">BT navigator</text><text x="730" y="230" fill="#57606a">the manager</text>
    <text x="730" y="302" font-weight="bold">Behavior server</text><text x="730" y="320" fill="#57606a">spin, back up, wait</text>
    <text x="340" y="302" font-weight="bold">Velocity smoother</text><text x="340" y="320" fill="#57606a">no sudden jumps</text>
    <text x="340" y="392" font-weight="bold">Robot</text><text x="340" y="410" fill="#57606a">turns the speed into steps</text>
  </g>
  <text x="462" y="198" fill="#57606a" font-size="12">"follow this path"</text>
  <text x="462" y="246" fill="#57606a" font-size="12">"compute a path"</text>
  <text x="742" y="264" fill="#57606a" font-size="12">when stuck</text>
</svg>
