<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="290" fill="#ffffff"/>

  <rect x="30" y="95" width="150" height="70" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="105" y="125" text-anchor="middle" font-weight="bold">Motion clips</text>
  <text x="105" y="145" text-anchor="middle" font-size="12" fill="#555">for example 32</text>

  <!-- grid of parallel robots -->
  <rect x="240" y="40" width="250" height="180" rx="8" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="365" y="62" text-anchor="middle" font-weight="bold" fill="#184f95">256 robots at once</text>
  <g fill="#2a78d6">
    <circle cx="275" cy="90" r="6"/><circle cx="305" cy="90" r="6"/><circle cx="335" cy="90" r="6"/><circle cx="365" cy="90" r="6"/><circle cx="395" cy="90" r="6"/><circle cx="425" cy="90" r="6"/><circle cx="455" cy="90" r="6"/>
    <circle cx="275" cy="120" r="6"/><circle cx="305" cy="120" r="6"/><circle cx="335" cy="120" r="6"/><circle cx="365" cy="120" r="6"/><circle cx="395" cy="120" r="6"/><circle cx="425" cy="120" r="6"/><circle cx="455" cy="120" r="6"/>
    <circle cx="275" cy="150" r="6"/><circle cx="305" cy="150" r="6"/><circle cx="335" cy="150" r="6"/><circle cx="365" cy="150" r="6"/><circle cx="395" cy="150" r="6"/><circle cx="425" cy="150" r="6"/><circle cx="455" cy="150" r="6"/>
    <circle cx="275" cy="180" r="6"/><circle cx="305" cy="180" r="6"/><circle cx="335" cy="180" r="6"/><circle cx="365" cy="180" r="6"/><circle cx="395" cy="180" r="6"/><circle cx="425" cy="180" r="6"/><circle cx="455" cy="180" r="6"/>
  </g>
  <text x="365" y="208" text-anchor="middle" font-size="12" fill="#555">each in its own copy of the scene</text>

  <rect x="550" y="95" width="150" height="70" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="625" y="120" text-anchor="middle" font-weight="bold">Scoring</text>
  <text x="625" y="140" text-anchor="middle" font-size="12" fill="#555">stayed up? no bad contact?</text>
  <text x="625" y="156" text-anchor="middle" font-size="12" fill="#555">task done?</text>

  <rect x="760" y="95" width="110" height="70" rx="8" fill="#fdf1ea" stroke="#eb6834" stroke-width="1.5"/>
  <text x="815" y="125" text-anchor="middle" font-weight="bold">Pass rate</text>
  <text x="815" y="145" text-anchor="middle" font-size="12" fill="#555">per clip</text>

  <line x1="180" y1="130" x2="238" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="130" x2="548" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="130" x2="758" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="450" y="262" text-anchor="middle" font-size="13" fill="#555">Every clip is tried several times. One try proves little, because small differences decide whether the robot falls.</text>
</svg>
