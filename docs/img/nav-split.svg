<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- robot side -->
  <rect x="20" y="20" width="400" height="390" rx="10" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="40" y="48" font-size="17" font-weight="bold" fill="#184f95">On the robot (fast loop)</text>

  <rect x="50" y="70" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="125" y="92" text-anchor="middle">LiDAR + IMU</text>
  <text x="125" y="110" text-anchor="middle" font-size="12" fill="#555">10 Hz / 200 Hz</text>

  <rect x="240" y="70" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="315" y="92" text-anchor="middle">Odometry (DLIO)</text>
  <text x="315" y="110" text-anchor="middle" font-size="12" fill="#555">odom &#8594; robot</text>

  <rect x="240" y="160" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="315" y="182" text-anchor="middle">Relocaliser</text>
  <text x="315" y="200" text-anchor="middle" font-size="12" fill="#555">map &#8594; odom</text>

  <rect x="50" y="250" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="125" y="272" text-anchor="middle">Obstacle stop</text>
  <text x="125" y="290" text-anchor="middle" font-size="12" fill="#555">from the live scan</text>

  <rect x="240" y="250" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="315" y="272" text-anchor="middle">Velocity bridge</text>
  <text x="315" y="290" text-anchor="middle" font-size="12" fill="#555">watchdog 0.5 s</text>

  <rect x="145" y="340" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="220" y="362" text-anchor="middle">Walking controller</text>
  <text x="220" y="380" text-anchor="middle" font-size="12" fill="#555">the robot's own</text>

  <line x1="200" y1="95" x2="238" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="315" y1="120" x2="315" y2="158" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="125" y1="120" x2="125" y2="248" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="275" x2="238" y2="275" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="315" y1="300" x2="262" y2="338" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- server side -->
  <rect x="600" y="20" width="280" height="390" rx="10" fill="#fdf1ea" stroke="#eb6834" stroke-width="1.5"/>
  <text x="620" y="48" font-size="17" font-weight="bold" fill="#9a3a12">On the server (slow loop)</text>

  <rect x="640" y="70" width="200" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="740" y="92" text-anchor="middle">Costmaps</text>
  <text x="740" y="110" text-anchor="middle" font-size="12" fill="#555">where the robot may go</text>

  <rect x="640" y="160" width="200" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="740" y="182" text-anchor="middle">Nav2 planner</text>
  <text x="740" y="200" text-anchor="middle" font-size="12" fill="#555">path to the goal</text>

  <rect x="640" y="250" width="200" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="740" y="272" text-anchor="middle">Nav2 controller</text>
  <text x="740" y="290" text-anchor="middle" font-size="12" fill="#555">velocity command</text>

  <rect x="640" y="340" width="200" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="740" y="362" text-anchor="middle">Viewer, goal picking</text>
  <text x="740" y="380" text-anchor="middle" font-size="12" fill="#555">RViz or Foxglove</text>

  <line x1="740" y1="120" x2="740" y2="158" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="740" y1="210" x2="740" y2="248" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- wireless link -->
  <text x="510" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">WLAN</text>
  <line x1="390" y1="95" x2="638" y2="95" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="510" y="86" text-anchor="middle" font-size="12" fill="#333">thinned cloud, 5 to 10 Hz</text>
  <line x1="390" y1="185" x2="638" y2="185" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="510" y="176" text-anchor="middle" font-size="12" fill="#333">position (odometry, TF)</text>
  <line x1="638" y1="275" x2="392" y2="275" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="510" y="266" text-anchor="middle" font-size="12" fill="#333">velocity command</text>
</svg>
