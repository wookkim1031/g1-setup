<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <g id="room">
      <rect x="0" y="0" width="190" height="130" fill="#f6f8fa" stroke="#24292f" stroke-width="3"/>
      <rect x="120" y="0" width="70" height="38" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
      <rect x="40" y="92" width="18" height="18" fill="#24292f"/>
    </g>
    <g id="robot">
      <circle r="7" fill="#157878"/>
      <line x1="0" y1="0" x2="13" y2="0" stroke="#157878" stroke-width="3"/>
    </g>
  </defs>

  <!-- 1 -->
  <g transform="translate(20,40)">
    <use href="#room"/>
    <g fill="#d1242f" opacity="0.75">
      <circle cx="60" cy="50" r="3"/><circle cx="75" cy="62" r="3"/><circle cx="88" cy="45" r="3"/><circle cx="70" cy="75" r="3"/>
      <circle cx="95" cy="70" r="3"/><circle cx="52" cy="66" r="3"/><circle cx="82" cy="82" r="3"/><circle cx="104" cy="55" r="3"/>
      <circle cx="66" cy="38" r="3"/><circle cx="98" cy="88" r="3"/><circle cx="47" cy="80" r="3"/><circle cx="112" cy="72" r="3"/>
    </g>
    <use href="#robot" x="84" y="64"/>
  </g>
  <text x="20" y="24" font-weight="bold" fill="#24292f">1. Many guesses</text>
  <text x="20" y="192" fill="#57606a">Red dots: possible positions,</text>
  <text x="20" y="208" fill="#57606a">spread around the start pose.</text>
  <text x="20" y="224" fill="#57606a">Green: where the robot really is.</text>

  <!-- 2 -->
  <g transform="translate(240,40)">
    <use href="#room"/>
    <g fill="#d1242f" opacity="0.75">
      <circle cx="92" cy="50" r="3"/><circle cx="109" cy="64" r="3"/><circle cx="118" cy="43" r="3"/><circle cx="101" cy="78" r="3"/>
      <circle cx="128" cy="72" r="3"/><circle cx="83" cy="68" r="3"/><circle cx="113" cy="85" r="3"/><circle cx="137" cy="57" r="3"/>
      <circle cx="97" cy="36" r="3"/><circle cx="131" cy="90" r="3"/><circle cx="78" cy="82" r="3"/><circle cx="144" cy="74" r="3"/>
    </g>
    <line x1="84" y1="118" x2="116" y2="118" stroke="#57606a" stroke-width="2"/>
    <polygon points="116,113 126,118 116,123" fill="#57606a"/>
    <use href="#robot" x="116" y="64"/>
  </g>
  <text x="240" y="24" font-weight="bold" fill="#24292f">2. Move them</text>
  <text x="240" y="192" fill="#57606a">The odometry says "0.5 m forward".</text>
  <text x="240" y="208" fill="#57606a">Every guess moves the same way,</text>
  <text x="240" y="224" fill="#57606a">plus a little randomness.</text>

  <!-- 3 -->
  <g transform="translate(460,40)">
    <use href="#room"/>
    <g stroke="#157878" stroke-width="1" opacity="0.6">
      <line x1="116" y1="64" x2="190" y2="64"/><line x1="116" y1="64" x2="116" y2="130"/><line x1="116" y1="64" x2="120" y2="38"/><line x1="116" y1="64" x2="0" y2="64"/>
    </g>
    <g fill="#d1242f">
      <circle cx="92" cy="50" r="2" opacity="0.4"/><circle cx="109" cy="64" r="5"/><circle cx="118" cy="43" r="2" opacity="0.4"/><circle cx="101" cy="78" r="2.5" opacity="0.5"/>
      <circle cx="128" cy="72" r="3.5"/><circle cx="83" cy="68" r="1.5" opacity="0.4"/><circle cx="113" cy="85" r="2" opacity="0.4"/><circle cx="137" cy="57" r="2" opacity="0.4"/>
      <circle cx="97" cy="36" r="1.5" opacity="0.4"/><circle cx="131" cy="90" r="1.5" opacity="0.4"/><circle cx="78" cy="82" r="1.5" opacity="0.4"/><circle cx="144" cy="74" r="1.5" opacity="0.4"/>
      <circle cx="119" cy="61" r="6"/>
    </g>
    <use href="#robot" x="116" y="64"/>
  </g>
  <text x="460" y="24" font-weight="bold" fill="#24292f">3. Score them with the scan</text>
  <text x="460" y="192" fill="#57606a">"If I stood here, would the walls</text>
  <text x="460" y="208" fill="#57606a">be at the distances I measure?"</text>
  <text x="460" y="224" fill="#57606a">Big dot = fits well.</text>

  <!-- 4 -->
  <g transform="translate(680,40)">
    <use href="#room"/>
    <g fill="#d1242f" opacity="0.75">
      <circle cx="112" cy="62" r="3"/><circle cx="118" cy="66" r="3"/><circle cx="115" cy="59" r="3"/><circle cx="121" cy="62" r="3"/>
      <circle cx="109" cy="66" r="3"/><circle cx="117" cy="70" r="3"/><circle cx="123" cy="67" r="3"/><circle cx="113" cy="69" r="3"/>
      <circle cx="120" cy="58" r="3"/><circle cx="110" cy="60" r="3"/><circle cx="125" cy="71" r="3"/><circle cx="116" cy="63" r="3"/>
    </g>
    <use href="#robot" x="116" y="64"/>
  </g>
  <text x="680" y="24" font-weight="bold" fill="#24292f">4. Keep the good ones</text>
  <text x="680" y="192" fill="#57606a">Poor guesses are dropped, good</text>
  <text x="680" y="208" fill="#57606a">ones copied. The cloud tightens</text>
  <text x="680" y="224" fill="#57606a">around the true position.</text>
</svg>
